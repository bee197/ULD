env_name: "Pendulum-v1"
seed: 42
total_steps: 200_000
start_steps: 2000
update_every: 1
eval_interval: 5000
eval_episodes: 5
batch_size: 512
num_envs: 4

latent_dim: 64
encoder_type: "mlp"
hidden_dims: [256, 256]

gamma: 0.99
tau: 0.005
policy_delay: 4

H_enc: 1
H_Q: 3
nstep: 2

lambda_r: 1.0
lambda_d: 1.0
lambda_t: 1.0
lambda_pre: 0.0

lr_repr: 0.0003
lr_critic: 0.00003
lr_actor: 0.00003

buffer_capacity: 100_000
alpha_prior: 0.0
beta_prior: 1.0

num_bins: 101
vmin: -3   # 覆盖 Pendulum 奖励范围
vmax: 1

device: "cuda"